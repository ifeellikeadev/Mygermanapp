<script>

function mark(id,g){const c=S.c[id]||{b:0},t=today();if(g==0){c.b=0;c.d=t}else if(g==1)c.d=t+Math.max(1,Math.round(IV[c.b]/2));else if(g==2){c.b=Math.min(c.b+1,3);c.d=t+IV[c.b]}else if(g==3){c.b=Math.min(c.b+2,3);c.d=t+IV[c.b]}else{c.b=3;c.d=t+60;c.k=1}S.c[id]=c;sv()}

 if(L.day!=t){L.day=t;const ti=LV.indexOf(lvl()),ky=i=>{const d=LV.indexOf(W[i][5])-ti;return d==0?0:d<0?1:2+d},nw=O.filter(i=>!seen.has('w'+i)).sort((a,b)=>ky(a)-ky(b)).slice(0,S.s.n).map(i=>'w'+i);const ng=S.s.g?G.filter(r=>!seen.has(r.id)).slice(0,1).map(r=>r.id):[];L.q=[...due.slice(0,40),...nw,...ng];L.i=0;L.f=0;L.n=L.q.length}

 const id=L.q[L.i],k=id[0],x=k=='w'?W[+id.slice(1)]:k=='g'?G.find(r=>r.id==id):V[+id.slice(1)];
 let cl='',top,bk;if(k=='w'){cl=GC[x[1]]||'';top=`${AR[x[1]]?`<div class="chip">${AR[x[1]]}</div><br>`:''}<div class="wd">${x[0]}</div><div class="sub">${x[3]} · ${x[4]} · ${x[5]}</div>`;bk=`<div class="tr">${x[2]}</div>${x[8]?`<p class="m" style="text-align:center">plural: die ${x[8]}</p>`:''}<p>${x[7]}</p>`}

 H(`<div class="pg"><i style="width:${L.i/L.q.length*100}%"></i></div><div class="m">${L.i+1} of ${L.q.length}</div><div class="fc ${cl}" onclick="L.f=1;learn()"><div class="top">${top}</div>${L.f?`<div class="bk">${bk}</div>`:'<p class="sub" style="position:relative;z-index:1;text-align:center;padding:0 0 22px">tap to flip</p>'}</div>${L.f?`<div class="gb"><button class="a" onclick="gr(0)">Again<small>${ivt(id,0)}</small></button><button class="h" onclick="gr(1)">Hard<small>${ivt(id,1)}</small></button><button class="gd" onclick="gr(2)">Good<small>${ivt(id,2)}</small></button><button class="e" onclick="gr(3)">Easy<small>${ivt(id,3)}</small></button></div><button class="b o" style="width:100%;margin-top:10px" onclick="gr(4)">I already know this</button>`:''}`)}

 const x=Q[Q.i];H(`<div class="pg"><i style="width:${Q.i/Q.length*100}%"></i></div><div class="m">Question ${Q.i+1} of ${Q.length}${x.hint?' · '+x.hint:''}</div><div class="card"><div class="tr" style="margin:6px 0 14px;font-size:24px">${x.q}</div>${x.t?`<input id="ti" placeholder="${x.ar?'with article, e.g. der Hund':'the German word'}" autocomplete="off" autocapitalize="none" onkeydown="if(event.key=='Enter')qa(this.value)"><button class="b" onclick="qa($('#ti').value)">Check</button>`:x.o.map((o,j)=>`<button class="b o opt" data-a="${String(o).replace(/"/g,'&quot;')}" onclick="qa(this.dataset.a,this)"><i>${'ABCD'[j]}</i>${o}</button>`).join('')}</div>`)}
function qa(a,el){const x=Q[Q.i],n=s=>s.toLowerCase().replace(/\s+/g,' ').trim();let ok,msg='';
 if(x.t){ok=n(a)==n(x.a);if(!ok&&x.ar&&n(a)==n(x.a).replace(/^(der|die|das) /,''))msg=' (the article is required)'}else ok=a==x.a;
 if(ok)Q.s++;rec(x.ty,x.lv,ok);if(x.id){const c=S.c[x.id];if(!ok){mark(x.id,0);S.c[x.id].x=(S.c[x.id].x||0)+1}else if(c&&c.x)c.x--;sv()}act(ok?8:2);
 document.querySelectorAll('.opt').forEach(b=>{if(b.dataset.a==x.a)b.classList.add('ok');else if(b==el)b.classList.add('no')});if(navigator.vibrate)navigator.vibrate(ok?18:[30,40,30]);if(ok)burst(14);
 const c=$('.card');c.insertAdjacentHTML('beforeend',`<div class="fb ${ok?'ok':'no'}"><b>${ok?pick(['Genau!','Super!','Stark!','Richtig!','Klasse!'],1)[0]:pick(['Fast!','Nochmal!','Nicht ganz.'],1)[0]}</b>${ok?'':`<p style="margin:4px 0 0">${x.a}${msg}</p>`}</div><button class="b" style="margin-top:12px;width:100%" onclick="Q.i++;quiz()">Weiter</button>`);c.querySelectorAll('.opt,input').forEach(b=>b.disabled=true)}
// ---------- GRAMMAR / BROWSE ----------
function grammar(){H(G.map(r=>`<div class="card" style="padding:14px 16px" onclick="const d=this.querySelector('.d');d.hidden=!d.hidden"><b>${r.title}</b><div class="m">${r.level} · ${S.c[r.id]?['new','learning','learning','mastered'][S.c[r.id].b]:'not started'}</div><div class="d" hidden>${gbody(r)}</div></div>`).join(''))}
let BF={t:'all',q:'',n:150};
function browse(){const th=['all','irregular verbs',...new Set(W.map(w=>w[4]))].sort((a,b)=>a=='all'?-1:b=='all'?1:a<b?-1:1);
 let items;if(BF.t=='irregular verbs')items=V.map((x,i)=>({h:`<b>${x.inf}</b> <span class="m">${x.en}</span>`,d:vtab(x),id:'v'+i})).filter(o=>o.h.toLowerCase().includes(BF.q));
 else items=W.map((w,i)=>({w,i})).filter(o=>(BF.t=='all'||o.w[4]==BF.t)&&(o.w[0]+o.w[2]).toLowerCase().includes(BF.q)).map(o=>({g:GC[o.w[1]]||'',h:`<b>${wd(o.w)}</b><br><span class="m">${o.w[2]}</span><span class="tag">${o.w[5]}</span>`,d:`<p class="m">${o.w[3]} · ${o.w[4]}${o.w[8]?' · plural: '+o.w[8]:''}</p><p>${o.w[7]}</p>`,id:'w'+o.i}));
 const st=id=>S.c[id]?['new','1','2','✓'][S.c[id].b]:'';
 H(`<select onchange="BF.t=this.value;browse()">${th.map(t=>`<option ${t==BF.t?'selected':''}>${t}</option>`).join('')}</select><input placeholder="search" value="${BF.q}" oninput="BF.q=this.value.toLowerCase();clearTimeout(window.bt);window.bt=setTimeout(browse,300)"><div class="m">${items.length} entries</div><div>${items.slice(0,BF.n).map(o=>`<div class="row ${o.g||''}" onclick="this.lastChild.hidden=!this.lastChild.hidden">${o.h}<span class="tag">${st(o.id)}</span><div hidden>${o.d}</div></div>`).join('')}${items.length>BF.n?'<button class="b o" onclick="BF.n+=150;browse()">More</button>':''}</div>`);const i=document.querySelector('input');if(BF.q){i.focus();i.setSelectionRange(99,99)}}
// ---------- STATS ----------
const ac=l=>{const q=(S.ql||{})[l]||{c:0,w:0},n=q.c+q.w;return n?Math.round(q.c/n*100)+'%':'–'},ar=k=>{const q=(S.qt||{})[k]||{c:0,w:0},n=q.c+q.w;return n?Math.round(q.c/n*100):null},wk=()=>{const a=['w','v','g'].map(k=>[k,ar(k)]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1])[0];return a&&a[1]<75?`<p>Focus on <b>${AN[a[0]]}</b>: those cards come back more often.</p>`:''};
function stats(){const t=today(),st=streak(),days=[...Array(7)].map((_,i)=>S.d[t-6+i]||0),mx=Math.max(1,...days),n=Object.keys(S.c).length,wn=Object.keys(S.c).filter(k=>k[0]=='w').length,gn=G.filter(r=>S.c[r.id]).length,dn=['Su','Mo','Tu','We','Th','Fr','Sa'],pb=(a,b)=>`<div class="pb"><i style="width:${a/b*100}%"></i></div>`,L2=lvn(),b0=(L2-1)*(L2-1)*40,e0=L2*L2*40;
 H(`<div class="card hero"><div class="big">🔥 ${st}</div><p class="m" style="margin:6px 0 16px">day${st==1?'':'s'} in a row</p><div class="bar">${days.map((x,i)=>`<div class="${i==6?'td':''}"><i style="height:${x/mx*80}%"></i>${dn[new Date((t-6+i)*864e5).getUTCDay()]}</div>`).join('')}</div></div>
 <div class="card" style="display:flex;gap:16px;align-items:center"><div class="ring" style="--p:${((S.xp||0)-b0)/(e0-b0)*100}%"><b>${L2}</b></div><div><b style="font:800 20px 'Bricolage Grotesque',system-ui">${RK[Math.min(L2-1,7)]}</b><p class="m" style="margin:2px 0 0">${S.xp||0} XP · ${e0-(S.xp||0)} to level ${L2+1}</p></div></div>
 <div class="card"><b>Progress</b><p class="m" style="margin:10px 0 0">Words started: ${wn} of ${W.length}</p>${pb(wn,W.length)}<p class="m" style="margin:0">Grammar rules: ${gn} of ${G.length}</p>${pb(gn,G.length)}<p class="m" style="margin:0">Mastered cards: ${Object.values(S.c).filter(c=>c.b==3).length} of ${n} started</p></div>
 <div class="card"><b>Your level</b><p style="margin:8px 0">Working on <b>${lvl()}</b>. New words come from this level first and move up as your quiz scores stay above 80%.</p><p class="m">Quiz accuracy: ${LV.map(l=>l+' '+ac(l)).join(' · ')}</p><p class="m">By area: ${['w','v','g'].map(k=>AN[k]+' '+(ar(k)==null?'–':ar(k)+'%')).join(' · ')}</p>${wk()}</div>
 <div class="card"><b>Settings</b><p class="m" style="margin:10px 0 0">New words per day<input type="number" min="0" max="50" value="${S.s.n}" onchange="S.s.n=+this.value;L.day=0;sv()"></p><label style="display:flex;gap:10px;align-items:center;margin:10px 0"><input type="checkbox" style="width:24px;margin:0" ${S.s.g?'checked':''} onchange="S.s.g=this.checked?1:0;L.day=0;sv()"> Grammar rules in Learn</label><button class="b" onclick="place()">Retake placement test</button><button class="b o" onclick="navigator.clipboard.writeText(JSON.stringify(S)).then(()=>alert('Progress copied'))">Export</button><button class="b o" onclick="let t=prompt('Paste exported progress');if(t){S=JSON.parse(t);sv();go('stats')}">Import</button></div>`)}
// ---------- PLACEMENT ----------
function place(){const qs=[];for(const lv of['A1','A2','B1']){const p0=O.map(i=>[W[i],i]).filter(x=>x[0][5]==lv&&x[0][3]!='phrase'),p=p0.slice(0,Math.ceil(p0.length*.6));pick(p,8).forEach(([w,i])=>qs.push({lv,q:wd(w),o:sh([w[2],...pick(W.filter(y=>y!=w&&y[3]==w[3]),3).map(y=>y[2])]),a:w[2]}))}
 Q=qs;Q.i=0;Q.s=0;Q.pl=1;Q.res={A1:0,A2:0,B1:0};tab='quiz';tabs();pq()}
function pq(){if(Q.i>=Q.length){const ks=['A1','A2','B1'].filter(l=>Q.res[l]>=6);W.forEach((w,i)=>{if(ks.includes(w[5])&&!S.c['w'+i])mark('w'+i,4)});S.p=1;const r=Q.res;S.ql=S.ql||{};['A1','A2','B1'].forEach(l=>S.ql[l]={c:r[l],w:8-r[l]});sv();Q=[];return H(`<div class="card"><b>Result</b><p>A1: ${r.A1}/8 · A2: ${r.A2}/8 · B1: ${r.B1}/8</p><p>${ks.length?'Marked as known: '+ks.join(', '):'Nothing marked as known, you will start from the beginning.'}</p><button class="b" onclick="L.day=0;go('learn')">Start learning</button></div>`)}
 const x=Q[Q.i];H(`<div class="m">Placement test ${Q.i+1} / ${Q.length} (${x.lv})</div><div class="card"><div class="big">${x.q}</div>${x.o.map(o=>`<button class="b o opt" onclick="pa('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>`)}
function pa(a){const x=Q[Q.i];if(a==x.a)Q.res[x.lv]++;Q.i++;pq()}
// ---------- BOOT ----------
Promise.all(['words','grammar','verbs'].map(f=>fetch('data/'+f+'.json').then(r=>r.json()))).then(([w,g,v])=>{W=w.w;O=W.map((_,i)=>i).sort((a,b)=>W[a][6]-W[b][6]);G=g.rules;V=v.verbs;
 tabs();if(!S.p)return place();if(S.q!=today()&&Object.keys(S.c).length>3){tab='quiz';tabs();return quiz()}go('learn')}).catch(e=>H('<div class="card">Could not load data: '+e+'</div>'));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
