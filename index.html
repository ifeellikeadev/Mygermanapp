const fo=s=>n(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
if(x.t){ok=fo(a)==fo(x.a);if(!ok&&x.ar&&fo(a)==fo(x.a).replace(/^(der|die|das) /,''))msg=' (the article is required)'}else ok=a==x.a;
if(ok)Q.s++;rec(x.ty,x.lv,ok);if(x.id){const c=S.c[x.id];if(!ok){mark(x.id,0);S.c[x.id].x=(S.c[x.id].x||0)+1}else{if(c&&c.x)c.x--;if(c&&c.d<=today())mark(x.id,2)}sv()}act(ok?8:2);
document.querySelectorAll('.opt').forEach(b=>{if(b.getAttribute('data-a')==x.a)b.classList.add('ok');else if(b==el)b.classList.add('no')});if(navigator.vibrate)navigator.vibrate(ok?18:[30,40,30]);if(ok)burst(Math.min(20,5+Q.s));
const c=$('.card');c.insertAdjacentHTML('beforeend','<div class="fb '+( ok?'ok':'no')+'"><b>'+( ok?pick(['Genau!','Super!','Stark!','Richtig!','Klasse!'],1)[0]:pick(['Fast!','Nochmal!','Nicht ganz.'],1)[0])+'</b>'+msg+'</div>');setTimeout(()=>{Q.i++;quiz();},ok?1200:1600)}
function grammar(){H(G.map(r=>'<div class="card" style="padding:14px 16px" onclick="const d=this.querySelector(\'.d\');d.hidden=!d.hidden"><b>'+r.title+'</b><div class="m">'+r.level+' · '+(S.c[r.id]?'Seen':'New')+'</div><div class="d hidden">'+gbody(r)+'</div></div>').join(''))}
let BF={t:'all',q:'',n:150,s:'all'};
const stt=id=>{const c=S.c[id];return !c?'new':(c.b>=2||c.k)?'learned':'learning'};
function browse(){const th=['all','irregular verbs',...new Set(W.map(w=>w[4]))].sort((a,b)=>a=='all'?-1:b=='all'?1:a<b?-1:1),sts=['all','learned','learning','new','needs work'],okS=id=>BF.s=='all'||stt(id)==BF.s,okT=w=>BF.t=='all'||w[4]==BF.t;
let items;if(BF.t=='irregular verbs')items=V.map((x,i)=>({h:'<b>'+x.inf+'</b><br><span class="m">'+x.en+'</span>',d:vtab(x),id:'v'+i})).filter(o=>(o.h+'').toLowerCase().includes(BF.q)&&okS(o.id));
else items=W.map((w,i)=>({w,i})).filter(o=>okT(o.w)&&(o.w[0]+o.w[2]).toLowerCase().includes(BF.q)&&okS('w'+o.i)).map(o=>({g:GC[o.w[1]]||'',h:'<b>'+wd(o.w)+'</b><br><span class="m">'+o.w[2]+'</span>',d:'<span class="m">'+o.w[7]+'</span>',id:'w'+o.i}));
H('<div class="sel"><select onchange="BF.t=this.value;browse()">'+th.map(t=>'<option '+(t==BF.t?'selected':'') +'>'+t+'</option>').join('')+'</select><select onchange="BF.s=this.value;browse()">'+sts.map(s=>'<option '+(s==BF.s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><p class="m">'+items.length+' items</p>'+items.map(o=>'<div class="row '+o.g+'"><b>'+o.h+'</b>'+(o.d?'<div class="m">'+o.d+'</div>':'')+(S.c[o.id]?'<div class="xb"><i style="width:'+Math.min(100,(S.c[o.id].b+1)*25)+'%"></i></div>':'')+'</div>').join('')+'');}
const ac=l=>{const q=(S.ql||{})[l]||{c:0,w:0},n=q.c+q.w;return n?Math.round(q.c/n*100)+'%':'–'};
function progress(){const t=today(),st=streak(),days=[...Array(7)].map((_,i)=>S.d[t-6+i]||0),mx=Math.max(1,...days),dn=['Su','Mo','Tu','We','Th','Fr','Sa'],wl=Object.entries(S.c||{}).filter(([i])=>i[0]=='w'&&(S.c[i].b>=2||S.c[i].k)).map(x=>+x[0].slice(1)),wg=Object.entries(S.c||{}).filter(([i])=>i[0]=='w'&&S.c[i].b==1).length,b0=0,e0=1200,L2=Math.min(lvn(),8),need=Object.entries(S.c||{}).filter(([i])=>i[0]=='w'&&S.c[i].x>=2).map(x=>x[0]);
H('<div class="card hero"><div class="big">🔥 '+st+'</div><p class="m" style="margin:6px 0 16px">day'+(st==1?'':'s')+' in a row</p><div class="bar">'+days.map((x,i)=>'<div class="'+(i==6?'td':'')+' "><i style="height:'+x/mx*100+'%"></i></div>').join('')+'<div class="m" style="flex:1;text-align:center">'+dn.map((n,i)=>'<div style="font-size:10px">'+n+'</div>').join('')+'</div></div></div><div class="card" style="display:flex;gap:16px;align-items:center"><div class="ring" style="--p:'+((S.xp||0)-b0)/(e0-b0)*100+'%"><b>'+L2+'</b></div><div><b style="font:800 20px \'Bricolage Grotesque\',system-ui">Level '+L2+'</b><p class="m" style="margin:4px 0 0">'+RK[Math.min(L2-1,7)]+'</p></div></div><div class="card"><b>Current level</b><p style="margin:10px 0 2px"><span class="big" style="font-size:40px">'+getAdaptiveLevel()+'</span><span class="m"> and ramping up</span></p></div><div class="card"><b>What you know</b><p style="margin:10px 0 2px"><span class="big" style="font-size:40px">'+wl.length+'</span> <span class="m">words learned · '+wg+' learning · '+(W.length-wl.length-wg)+' to go</span></p></div><div class="card"><b>Words you know</b><p style="margin:8px 0">'+(wl.length?wl.slice(-60).reverse().map(i=>'<span class="wc '+GC[W[i][1]]+'">'+wd(W[i])+'</span>').join(''):' <span class="m">Nothing yet — start the first quiz!</span>')+'</p></div>'+(need.length?'<div class="card"><b>Needs work</b><p style="margin:8px 0">'+need.map(k=>'<span class="wc '+GC[W[+k.slice(1)][1]]+'">'+wd(W[+k.slice(1)])+'</span>').join('')+'</p></div>':' ')+'<div class="card"><b>How it works</b><p class="m">You start with A1 words. As you learn more, A2, B1, and B2 words gradually mix in. Quiz difficulty adapts to your level!</p></div>');}
Promise.all(['words','grammar','verbs'].map(f=>fetch('data/'+f+'.json').then(r=>r.json()))).then(([w,g,v])=>{W=w.w;O=W.map((_,i)=>i).sort((a,b)=>W[a][6]-W[b][6]);G=g.rules;V=v.verbs;tabs();go('quiz')}).catch(e=>H('<div class="card">Could not load data: '+e+'</div>'));
