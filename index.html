.gm{--g1:var(--m1);--g2:var(--m2)}.gf{--g1:var(--f1);--g2:var(--f2)}.gn{--g1:var(--n1);--g2:var(--n2)}

.bar{display:flex;align-items:flex-end;gap:8px;height:110px}.bar div{flex:1;text-align:center;font-size:11px;color:var(--m);height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}.bar i{display:block;background:var(--l);border-radius:8px;min-height:6px}.bar .td i{background:var(--hd)}.big{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1}.pb{height:10px;background:var(--bg);border-radius:9px;margin:6px 0 12px;overflow:hidden}.pb i{display:block;height:100%;background:var(--hd);border-radius:9px}</style></head><body><header id="h"></header><main id="v"></main>
<nav id="n"></nav>
<script>
const $=s=>document.querySelector(s),K='dl1',IV=[1,3,7,21],AR={m:'der',f:'die',n:'das'},COL={m:'var(--m1)',f:'var(--f1)',n:'var(--n1)'},GC={m:'gm',f:'gf',n:'gn'},TT={learn:'Learn',quiz:'Quiz',grammar:'Grammar',browse:'Browse',stats:'Stats'};
let W=[],O=[],G=[],V=[],S,tab='learn',Q=[];
S=JSON.parse(localStorage[K]||'{}');S.c=S.c||{};S.s=S.s||{n:4,g:1};S.d=S.d||{};
const sv=()=>localStorage[K]=JSON.stringify(S),today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),pick=(a,n)=>sh(a).slice(0,n);
const wd=(w,big)=>`<span style="color:${COL[w[1]]||'inherit'}">${AR[w[1]]?AR[w[1]]+' ':''}${w[0]}</span>`;
const v=()=>$('#v'),H=h=>v().innerHTML=h,streak=()=>{const t=today();let n=0,d=S.d[t]?t:t-1;while(S.d[d]){n++;d--}return n},ICO={learn:'M4 5h6a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v12a2 2 0 012-2h6z',quiz:'M13 2L4 14h7l-1 8 9-12h-7z',grammar:'M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01',browse:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',stats:'M5 20V10M12 20V4M19 20v-7'};
function tabs(){$('#n').innerHTML=Object.keys(TT).map(k=>`<button class="${tab==k?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24"><path d="${ICO[k]}"/></svg>${TT[k]}</button>`).join('');$('#h').innerHTML=`<h1>${TT[tab]}</h1><span class="sc">🔥 ${streak()}</span>`}
function go(t){tab=t;tabs();({learn,quiz,grammar,browse,stats})[t]()}
function mark(id,g){const c=S.c[id]||{b:0},t=today();if(g==0){c.b=0;c.d=t}else if(g==1)c.d=t+Math.max(1,Math.round(IV[c.b]/2));else if(g==2){c.b=Math.min(c.b+1,3);c.d=t+IV[c.b]}else if(g==3){c.b=Math.min(c.b+2,3);c.d=t+IV[c.b]}else{c.b=3;c.d=t+60;c.k=1}S.c[id]=c;sv()}
const act=()=>{const t=today();S.d[t]=(S.d[t]||0)+1;sv()};
function vtab(x){const f=(a,l)=>`<tr><th>${l}</th>${a.map(s=>`<td>${s}</td>`).join('')}</tr>`,p=['ich','du','er/sie/es','wir','ihr','sie/Sie'];return `<table>${p.map((q,i)=>`<tr><th>${q}</th><td>${x.present[i]}</td><td>${x.preterite[i]}</td></tr>`).join('')}<tr><th>Perfekt</th><td colspan=2>${x.aux}: ${x.participle}</td></tr></table><div class="m">present · Präteritum</div>`}
function gbody(r){return `<p>${r.explain}</p>${r.table?`<table><tr>${r.table.head.map(h=>`<th>${h}</th>`).join('')}</tr>${r.table.rows.map(a=>`<tr>${a.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`:''}${r.examples.map(e=>`<p>${e[0]}<br><span class="m">${e[1]}</span></p>`).join('')}`}
// ---------- LEARN ----------
let L={q:[],i:0,f:0};
function ivt(id,g){const b=(S.c[id]||{b:0}).b;return g==0?'<1d':(g==1?Math.max(1,Math.round(IV[b]/2)):IV[Math.min(b+(g==2?1:2),3)])+'d'}
function learn(){const t=today(),due=sh(Object.keys(S.c).filter(k=>S.c[k].d<=t)),seen=new Set(Object.keys(S.c));
 if(L.day!=t){L.day=t;const ti=LV.indexOf(lvl()),ky=i=>{const d=LV.indexOf(W[i][5])-ti;return d==0?0:d<0?1:2+d},nw=O.filter(i=>!seen.has('w'+i)).sort((a,b)=>ky(a)-ky(b)).slice(0,S.s.n).map(i=>'w'+i);const ng=S.s.g?G.filter(r=>!seen.has(r.id)).slice(0,1).map(r=>r.id):[];L.q=[...due.slice(0,40),...nw,...ng];L.i=0;L.f=0;L.n=L.q.length}
 if(L.i>=L.q.length)return H(`<div class="card" style="text-align:center;padding:36px 18px"><div class="big">✓</div><h2 style="margin:12px 0 4px">Done for today</h2><p class="m">${L.n} cards reviewed. Test yourself in the Quiz tab.</p><button class="b" onclick="go('quiz')">Open quiz</button></div>`);
 const id=L.q[L.i],k=id[0],x=k=='w'?W[+id.slice(1)]:k=='g'?G.find(r=>r.id==id):V[+id.slice(1)];
 let cl='',top,bk;if(k=='w'){cl=GC[x[1]]||'';top=`${AR[x[1]]?`<div class="chip">${AR[x[1]]}</div><br>`:''}<div class="wd">${x[0]}</div><div class="sub">${x[3]} · ${x[4]} · ${x[5]}</div>`;bk=`<div class="tr">${x[2]}</div>${x[8]?`<p class="m" style="text-align:center">plural: die ${x[8]}</p>`:''}<p>${x[7]}</p>`}
 else if(k=='g'){top=`<div class="chip">grammar</div><div class="wd" style="font-size:26px">${x.title}</div><div class="sub">${x.level}</div>`;bk=gbody(x)}
 else{top=`<div class="chip">irregular verb</div><div class="wd">${x.inf}</div>`;bk=`<div class="tr">${x.en}</div>${vtab(x)}`}
 H(`<div class="pg"><i style="width:${L.i/L.q.length*100}%"></i></div><div class="m">${L.i+1} of ${L.q.length}</div><div class="fc ${cl}" onclick="L.f=1;learn()"><div class="top">${top}</div>${L.f?`<div class="bk">${bk}</div>`:'<p class="sub" style="text-align:center;padding:14px">Tap to see the answer</p>'}</div>${L.f?`<div class="gb"><button class="a" onclick="gr(0)">Again<small>${ivt(id,0)}</small></button><button class="h" onclick="gr(1)">Hard<small>${ivt(id,1)}</small></button><button class="gd" onclick="gr(2)">Good<small>${ivt(id,2)}</small></button><button class="e" onclick="gr(3)">Easy<small>${ivt(id,3)}</small></button></div><button class="b o" style="width:100%;margin-top:10px" onclick="gr(4)">I already know this</button>`:''}`)}
function gr(g){const id=L.q[L.i];mark(id,g);act();if(g==0)L.q.splice(Math.min(L.i+4,L.q.length),0,id);L.i++;L.f=0;learn()}
// ---------- QUIZ ----------
const LV=['A1','A2','B1','B2'],AN={w:'words',v:'verbs',g:'grammar'};
function lvl(){for(const l of LV){const q=(S.ql||{})[l]||{c:0,w:0},n=q.c+q.w;if(n<6||q.c/n<.8)return l}return 'B2'}
function rec(ty,lv,ok){S.qt=S.qt||{};const a=S.qt[ty]=S.qt[ty]||{c:0,w:0};a[ok?'c':'w']++;if(a.c+a.w>80){a.c=Math.round(a.c/2);a.w=Math.round(a.w/2)}if(LV.includes(lv)){S.ql=S.ql||{};const q=S.ql[lv]=S.ql[lv]||{c:0,w:0};q[ok?'c':'w']++;if(q.c+q.w>60){q.c=Math.round(q.c/2);q.w=Math.round(q.w/2)}}sv()}
function wpick(it,n){const o=[];it=it.slice();while(o.length<n&&it.length){let r=Math.random()*it.reduce((a,x)=>a+x.w,0),i=0;for(;i<it.length-1;i++){r-=it[i].w;if(r<=0)break}o.push(it.splice(i,1)[0])}return o}
function mkQ(){const t=today(),rq=new Set(S.rq||[]),ids=Object.keys(S.c),wt=k=>{const c=S.c[k];return(1+(c.x||0)*2+(c.d<=t?3:0)+(c.b==0?2:0))*(c.k?.3:1)*(rq.has(k)?.15:1)};
 const wi=ids.filter(i=>i[0]=='w').map(k=>({k,w:wt(k)})),vi=ids.filter(i=>i[0]=='v').map(k=>({k,w:wt(k)})),gi=[];
 G.filter(r=>S.c[r.id]).forEach(r=>r.quiz.forEach((z,j)=>{const k=r.id+'.'+j;gi.push({k,r,z,w:(1+(S.c[r.id].x||0)*2)*(rq.has(k)?.15:1)})}));
 const nV=Math.min(2,vi.length),nG=Math.min(3,gi.length),nW=Math.min(wi.length,10-nV-nG),qs=[];
 wpick(wi,nW).forEach((o,j)=>{const w=W[+o.k.slice(1)],full=(AR[w[1]]?AR[w[1]]+' ':'')+w[0];
  if(j<Math.round(nW*.4))qs.push({q:`Translate to German: <b>${w[2]}</b>`,t:1,a:full,ar:!!AR[w[1]],id:o.k,ty:'w',lv:w[5],key:o.k});
  else qs.push({q:wd(w),o:sh([w[2],...pick([...new Set(W.filter(y=>y!=w&&y[3]==w[3]&&y[2]!=w[2]).map(y=>y[2]))],3)]),a:w[2],id:o.k,ty:'w',lv:w[5],key:o.k})});
 wpick(vi,nV).forEach(o=>{const x=V[+o.k.slice(1)],kd=pick(['pret','perf','du'],1)[0],f=y=>kd=='pret'?y.preterite[2]:kd=='perf'?y.aux+' '+y.participle:y.present[1],a=f(x);qs.push({q:`${x.inf}: ${kd=='pret'?'Präteritum (er)':kd=='perf'?'Perfekt':'du-form'}?`,o:sh([a,...pick([...new Set(V.filter(y=>y!=x&&f(y)!=a).map(f))],3)]),a,id:o.k,ty:'v',lv:x.level,key:o.k})});
 wpick(gi,nG).forEach(o=>qs.push({q:o.z.q,o:sh(o.z.opts),a:o.z.opts[o.z.a],hint:o.r.title,id:o.r.id,ty:'g',lv:o.r.level,key:o.k}));
 S.rq=[...(S.rq||[]),...qs.map(x=>x.key)].slice(-90);sv();return sh(qs)}
function quiz(){if(!Q.length||Q.done){const q=mkQ();if(!q.length)return H('<div class="card"><p>Learn a few cards first, then your daily quiz appears here automatically.</p></div>');Q=q;Q.i=0;Q.s=0;Q.done=0}
 if(Q.i>=Q.length){Q.done=1;S.q=today();sv();return H(`<div class="card" style="text-align:center;padding:36px 18px"><div class="big">${Q.s}/${Q.length}</div><p class="m">correct answers</p><button class="b" onclick="Q=[];quiz()">New quiz</button><button class="b o" onclick="go('learn')">Back to Learn</button></div>`)}
 const x=Q[Q.i];H(`<div class="pg"><i style="width:${Q.i/Q.length*100}%"></i></div><div class="m">Question ${Q.i+1} of ${Q.length}${x.hint?' · '+x.hint:''}</div><div class="card"><div class="tr" style="margin:6px 0 14px;font-size:24px">${x.q}</div>${x.t?`<input id="ti" placeholder="${x.ar?'with article, e.g. der Hund':'the German word'}" autocomplete="off" autocapitalize="none" onkeydown="if(event.key=='Enter')qa(this.value)"><button class="b" onclick="qa($('#ti').value)">Check</button>`:x.o.map(o=>`<button class="b o opt" onclick="qa(this.textContent,this)">${o}</button>`).join('')}</div>`)}
function qa(a,el){const x=Q[Q.i],n=s=>s.toLowerCase().replace(/\s+/g,' ').trim();let ok,msg='';
 if(x.t){ok=n(a)==n(x.a);if(!ok&&x.ar&&n(a)==n(x.a).replace(/^(der|die|das) /,''))msg=' (the article is required)'}else ok=a==x.a;
 if(ok)Q.s++;rec(x.ty,x.lv,ok);if(x.id){const c=S.c[x.id];if(!ok){mark(x.id,0);S.c[x.id].x=(S.c[x.id].x||0)+1}else if(c&&c.x)c.x--;sv()}act();
 document.querySelectorAll('.opt').forEach(b=>{if(b.textContent==x.a)b.classList.add('ok');else if(b==el)b.classList.add('no')});
 const c=$('.card');c.insertAdjacentHTML('beforeend',`<p>${ok?'✅ Correct':'❌ '+x.a+msg}</p><button class="b" onclick="Q.i++;quiz()">Next</button>`);c.querySelectorAll('.opt,input').forEach(b=>b.disabled=true)}
// ---------- GRAMMAR / BROWSE ----------
function grammar(){H(G.map(r=>`<div class="card" style="padding:14px 16px" onclick="const d=this.querySelector('.d');d.hidden=!d.hidden"><b>${r.title}</b><div class="m">${r.level} · ${S.c[r.id]?['new','learning','learning','mastered'][S.c[r.id].b]:'not started'}</div><div class="d" hidden>${gbody(r)}</div></div>`).join(''))}
let BF={t:'all',q:'',n:150};
function browse(){const th=['all','irregular verbs',...new Set(W.map(w=>w[4]))].sort((a,b)=>a=='all'?-1:b=='all'?1:a<b?-1:1);
 let items;if(BF.t=='irregular verbs')items=V.map((x,i)=>({h:`<b>${x.inf}</b> <span class="m">${x.en}</span>`,d:vtab(x),id:'v'+i})).filter(o=>o.h.toLowerCase().includes(BF.q));
 else items=W.map((w,i)=>({w,i})).filter(o=>(BF.t=='all'||o.w[4]==BF.t)&&(o.w[0]+o.w[2]).toLowerCase().includes(BF.q)).map(o=>({g:GC[o.w[1]]||'',h:`<b>${wd(o.w)}</b><br><span class="m">${o.w[2]}</span><span class="tag">${o.w[5]}</span>`,d:`<p class="m">${o.w[3]} · ${o.w[4]}${o.w[8]?' · plural: '+o.w[8]:''}</p><p>${o.w[7]}</p>`,id:'w'+o.i}));
 const st=id=>S.c[id]?['new','1','2','✓'][S.c[id].b]:'';
 H(`<select onchange="BF.t=this.value;browse()">${th.map(t=>`<option ${t==BF.t?'selected':''}>${t}</option>`).join('')}</select><input placeholder="search" value="${BF.q}" oninput="BF.q=this.value.toLowerCase();clearTimeout(window.bt);window.bt=setTimeout(browse,300)"><div class="m">${items.length} entries</div><div>${items.slice(0,BF.n).map(o=>`<div class="row ${o.g||''}" onclick="this.lastChild.hidden=!this.lastChild.hidden">${o.h}<span class="tag">${st(o.id)}</span><div hidden>${o.d}</div></div>`).join('')}${items.length>BF.n?'<button class="b o" onclick="BF.n+=150;browse()">More</button>':''}</div>`);const i=document.querySelector('input');if(BF.q){i.focus();i.setSelectionRange(99,99)}}
// ---------- STATS ----------
const ac=l=>{const q=(S.ql||{})[l]||{c:0,w:0},n=q.c+q.w;return n?Math.round(q.c/n*100)+'%':'–'},ar=k=>{const q=(S.qt||{})[k]||{c:0,w:0},n=q.c+q.w;return n?Math.round(q.c/n*100):null},wk=()=>{const a=['w','v','g'].map(k=>[k,ar(k)]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1])[0];return a&&a[1]<75?`<p>Focus on <b>${AN[a[0]]}</b>: those cards come back more often.</p>`:''};
function stats(){const t=today(),st=streak(),days=[...Array(7)].map((_,i)=>S.d[t-6+i]||0),mx=Math.max(1,...days),n=Object.keys(S.c).length,wn=Object.keys(S.c).filter(k=>k[0]=='w').length,gn=G.filter(r=>S.c[r.id]).length,dn=['Su','Mo','Tu','We','Th','Fr','Sa'],pb=(a,b)=>`<div class="pb"><i style="width:${a/b*100}%"></i></div>`;
 H(`<div class="card"><div class="big">🔥 ${st}</div><p class="m" style="margin:4px 0 14px">day${st==1?'':'s'} in a row</p><div class="bar">${days.map((x,i)=>`<div class="${i==6?'td':''}"><i style="height:${x/mx*80}%"></i>${dn[new Date((t-6+i)*864e5).getUTCDay()]}</div>`).join('')}</div></div>
 <div class="card"><b>Progress</b><p class="m" style="margin:10px 0 0">Words started: ${wn} of ${W.length}</p>${pb(wn,W.length)}<p class="m" style="margin:0">Grammar rules: ${gn} of ${G.length}</p>${pb(gn,G.length)}<p class="m" style="margin:0">Mastered cards: ${Object.values(S.c).filter(c=>c.b==3).length} of ${n} started</p></div>
 <div class="card"><b>Your level</b><p style="margin:8px 0">Working on <b>${lvl()}</b>. New words come from this level first and move up as your quiz scores stay above 80%.</p><p class="m">Quiz accuracy: ${LV.map(l=>l+' '+ac(l)).join(' · ')}</p><p class="m">By area: ${['w','v','g'].map(k=>AN[k]+' '+(ar(k)==null?'–':ar(k)+'%')).join(' · ')}</p>${wk()}</div><div class="card"><b>Settings</b><p class="m" style="margin:10px 0 0">New words per day<input type="number" min="0" max="50" value="${S.s.n}" onchange="S.s.n=+this.value;L.day=0;sv()"></p><label style="display:flex;gap:10px;align-items:center;margin:10px 0"><input type="checkbox" style="width:22px;margin:0" ${S.s.g?'checked':''} onchange="S.s.g=this.checked?1:0;L.day=0;sv()"> Grammar rules in Learn</label><button class="b" onclick="place()">Retake placement test</button><button class="b o" onclick="navigator.clipboard.writeText(JSON.stringify(S)).then(()=>alert('Progress copied'))">Export</button><button class="b o" onclick="let t=prompt('Paste exported progress');if(t){S=JSON.parse(t);sv();go('stats')}">Import</button></div>`)}
// ---------- PLACEMENT ----------
function place(){const qs=[];for(const lv of['A1','A2','B1']){const p0=O.map(i=>[W[i],i]).filter(x=>x[0][5]==lv&&x[0][3]!='phrase'),p=p0.slice(0,Math.ceil(p0.length*.6));pick(p,8).forEach(([w,i])=>qs.push({lv,q:wd(w),o:sh([w[2],...pick(W.filter(y=>y!=w&&y[3]==w[3]),3).map(y=>y[2])]),a:w[2]}))}
 Q=qs;Q.i=0;Q.s=0;Q.pl=1;Q.res={A1:0,A2:0,B1:0};tab='quiz';tabs();pq()}
function pq(){if(Q.i>=Q.length){const ks=['A1','A2','B1'].filter(l=>Q.res[l]>=6);W.forEach((w,i)=>{if(ks.includes(w[5])&&!S.c['w'+i])mark('w'+i,4)});S.p=1;const r=Q.res;S.ql=S.ql||{};['A1','A2','B1'].forEach(l=>S.ql[l]={c:r[l],w:8-r[l]});sv();Q=[];return H(`<div class="card"><b>Result</b><p>A1: ${r.A1}/8 · A2: ${r.A2}/8 · B1: ${r.B1}/8</p><p>${ks.length?'Marked as known: '+ks.join(', '):'Nothing marked as known, you will start from the beginning.'}</p><button class="b" onclick="L.day=0;go('learn')">Start learning</button></div>`)}
 const x=Q[Q.i];H(`<div class="m">Placement test ${Q.i+1} / ${Q.length} (${x.lv})</div><div class="card"><div class="big">${x.q}</div>${x.o.map(o=>`<button class="b o opt" onclick="pa('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>`)}
function pa(a){const x=Q[Q.i];if(a==x.a)Q.res[x.lv]++;Q.i++;pq()}
// ---------- BOOT ----------
Promise.all(['words','grammar','verbs'].map(f=>fetch('data/'+f+'.json').then(r=>r.json()))).then(([w,g,v])=>{W=w.w;O=W.map((_,i)=>i).sort((a,b)=>W[a][6]-W[b][6]);G=g.rules;V=v.verbs;
 tabs();if(!S.p)return place();if(S.q!=today()&&Object.keys(S.c).length>3){tab='quiz';tabs();return quiz()}go('learn')}).catch(e=>H('<div class="card">Could not load data: '+e+'</div>'));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
